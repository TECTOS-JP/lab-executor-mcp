<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}lab-executor monitor{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/vendor/uPlot.min.css">
  {% if edit_enabled %}<link rel="stylesheet" href="/static/vendor/codemirror.min.css">{% endif %}
  <script src="/static/vendor/htmx.min.js"></script>
  <script src="/static/vendor/htmx-sse.js"></script>
  <script src="/static/vendor/uPlot.iife.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">lab-executor monitor</a>
    <nav class="nav">
      <a href="/">ジョブ</a>
      {% if edit_enabled %}<a href="/recipes">レシピ</a>{% endif %}
    </nav>
    {% if edit_enabled %}
    <span class="badge edit">edit-dir</span>
    {% else %}
    <span class="badge readonly">read-only</span>
    {% endif %}
    <span class="version">v{{ pkg_version }} / ui {{ ui_version }}</span>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    実験ランタイムへの書き込みは行いません (M1: 読み取り専用モニタ)。
  </footer>
</body>
</html>
