<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}lab-executor monitor{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">lab-executor monitor</a>
    <span class="badge readonly">read-only</span>
    <span class="version">v{{ pkg_version }} / ui {{ ui_version }}</span>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    実験ランタイムへの書き込みは行いません (M1: 読み取り専用モニタ)。
  </footer>
</body>
</html>
