[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab-executor-mcp"
version = "2.31.0"
description = "Backend-independent experiment execution runtime for AI agents (split from visa-mcp v1.11)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "mcp", "experiment-automation", "laboratory-automation",
    "ai-agent", "dsl", "fastmcp", "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# v2.0: PyVISA は依存しない (backend は外部から注入)
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2.0",
    "pyyaml",
    # v2.31.0 (SP-5): array 型 / repeat collect / 式言語の np.* 名前空間。
    # 計測ドメインでは事実上常在のため extra にせず必須依存とする。
    "numpy>=1.24",
]

[project.optional-dependencies]
pdf = ["pdfplumber"]
# Web UI M1 (読み取り専用モニタ)。必須依存には入れない。
ui = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]
# httpx は starlette TestClient に必要。dev に ui 依存を含めて CI で
# UI テストが走るようにする。
dev = [
    "pytest", "pytest-asyncio", "pyyaml",
    "fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "httpx",
]

[project.scripts]
lab-executor = "lab_executor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_executor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "hardware: 実機 (Kikusui PMX 電源 / Yokogawa 計測器) が必要なテスト。LAB_EXECUTOR_HW_TESTS=1 で有効化",
]
