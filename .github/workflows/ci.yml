name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: compileall src tests
        run: python -m compileall src tests
      - name: import smoke
        run: python -c "import lab_executor; print('version=', lab_executor.__version__)"
      - name: backend layer smoke
        run: python -c "from lab_executor.backends import InstrumentBackend, MockBackend; b=MockBackend(); print('mock backend OK', b.backend_id)"
      - name: lab-executor CLI smoke
        run: |
          lab-executor --version
          lab-executor --help
      - name: no top-level visa_mcp import in lab_executor
        run: |
          python - <<'PY'
          import ast, pathlib
          bad = []
          for p in pathlib.Path("src/lab_executor").rglob("*.py"):
              text = p.read_text(encoding="utf-8")
              try:
                  tree = ast.parse(text)
              except SyntaxError:
                  continue
              for node in tree.body:
                  if isinstance(node, ast.ImportFrom) and node.module:
                      if node.module.startswith("visa_mcp"):
                          bad.append((str(p), node.module))
                  elif isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name.startswith("visa_mcp"):
                              bad.append((str(p), alias.name))
          assert not bad, f"top-level visa_mcp imports detected: {bad}"
          print("OK: no top-level visa_mcp imports")
          PY
      - name: pytest (v2.0 smoke + adapted tests)
        # v2.0.2: 152 個 inherited visa-mcp tests のうち、v2.0 split
        # 適応済みは tests/test_v200_split.py のみ (v2.1 で curated
        # subset へ拡張予定)
        run: pytest -q tests/test_v200_split.py

  pyvisa-not-installed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pip uninstall -y pyvisa pyvisa-py || true
      - name: import lab_executor without pyvisa
        run: python -c "import lab_executor; print('OK')"
      - name: pyvisa MUST NOT be in sys.modules
        run: python -c "import lab_executor, sys; assert 'pyvisa' not in sys.modules, 'pyvisa leaked'"
      - name: pytest (PyVISA 非依存テストのみ)
        run: pytest -q -m "not hardware" tests/test_v200_split.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build
      - run: python -m build
      - name: wheel install + import
        run: |
          pip install dist/*.whl
          python -c "import lab_executor; print('wheel install OK')"
